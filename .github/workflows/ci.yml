# .github/workflows/ci.yml
name: CI (Lint & Test + Docker)

on:
  push:
    branches: ["dev"]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter & Formatter Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest with Coverage
        env:
          DOLPHIN_BASE_URL: "https://api.dolphinboiler.com/HA/V1"
          DOLPHIN_EMAIL: "ci-test@example.com"
          DOLPHIN_API_KEY: "dummy-ci-key-do-not-use"
          DOLPHIN_DEVICE_NAME: "ci-test-device"
        run: uv run pytest

      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          
  docker-build-test:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create dummy .env file for CI
        run: |
          touch .env
          echo 'DOLPHIN_BASE_URL="https://api.dolphinboiler.com/HA/V1" # Leave this value' >> .env
          echo 'DOLPHIN_EMAIL="your_registered_email@example.com"' >> .env
          echo 'DOLPHIN_API_KEY="your_api_key_here"' >> .env
          echo 'DOLPHIN_DEVICE_NAME="your_device_name"' >> .env
          echo 'POLL_INTERVAL_SECONDS=120.0' >> .env
          echo 'TESTING=True' >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and start the container via Docker Compose
      - name: Build and start container
        run: docker compose up -d --build

      # 2. Wait for container to initialize and run the health check
      - name: Verify container health
        run: |
          # Sleep briefly for service spin-up
          sleep 5
          # Query the FastAPI OpenAPI docs endpoint inside the container
          docker compose exec -T dolphin-monitor curl -f http://localhost:8000/docs || exit 1

      # 3. View logs on failure for quick debugging
      - name: Show logs if failed
        if: failure()
        run: docker compose logs

      # 4. Clean up resources
      - name: Tear down containers
        if: always()
        run: docker compose down -v