# .github/workflows/ci.yml
name: CI (Lint & Test)

on:
  push:
    branches: ["dev"]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-test:
    name: Lint & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter & Formatter Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest with Coverage
        env:
          DOLPHIN_BASE_URL: "https://api.dolphinboiler.com/HA/V1"
          DOLPHIN_EMAIL: "ci-test@example.com"
          DOLPHIN_API_KEY: "dummy-ci-key-do-not-use"
          DOLPHIN_DEVICE_NAME: "ci-test-device"
        run: uv run pytest

      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
