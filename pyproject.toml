[project]
name = "dolphin-boiler-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = "."
markers = ["live: integration tests hitting real Dolphin API hardware"]
# -v: verbose output (lists each test function name)
# -m "not live": automatically ignore live tests during standard pytest execution
# --cov=app: measures code coverage for the app/ directory
# --cov-report=term-missing: shows missing line numbers in the terminal output
addopts = "-v -m \"not live\" --cov=app --cov-report=term-missing"

[tool.ruff.lint]
# B008: Allow FastAPI Depends() calls in route parameters
ignore = ["B008"]
