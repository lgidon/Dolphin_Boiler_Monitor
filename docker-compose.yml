version: '3.8'

services:
  dolphin-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dolphin_boiler_monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite database or data directory across container updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s